<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thank you for your donation to Hilth Foundation">
    <title>Payment Successful | Hilth Foundation</title>

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="assets/images/favicon.jpeg">
    <link rel="apple-touch-icon" href="assets/images/favicon.jpeg">
    <meta name="theme-color" content="#5143DE">

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,400;1,9..144,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css?v=2.0">

    <style>
        .success-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg);
            background: linear-gradient(135deg, #5143DE 0%, #2DD4BF 100%);
        }

        .success-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--space-3xl);
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-xl);
            animation: scaleIn 0.5s ease-out;
        }

        .success-icon svg {
            width: 48px;
            height: 48px;
            color: white;
            stroke-width: 3;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-title {
            font-family: var(--font-heading);
            font-size: var(--text-3xl);
            font-weight: 800;
            color: var(--color-purple-dark);
            margin-bottom: var(--space-md);
        }

        .success-message {
            font-size: var(--text-lg);
            color: var(--color-text-secondary);
            margin-bottom: var(--space-xl);
            line-height: 1.6;
        }

        .reference-box {
            background: var(--color-bg-light);
            padding: var(--space-lg);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-xl);
        }

        .reference-label {
            font-size: var(--text-sm);
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: var(--space-xs);
        }

        .reference-code {
            font-family: 'Courier New', monospace;
            font-size: var(--text-md);
            font-weight: 600;
            color: var(--color-purple-dark);
            word-break: break-all;
        }

        .success-actions {
            display: flex;
            gap: var(--space-md);
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-md) var(--space-xl);
            border-radius: var(--radius-md);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: var(--text-md);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-purple) 0%, var(--color-purple-dark) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(81, 67, 222, 0.3);
        }

        .btn-secondary {
            background: white;
            color: var(--color-purple);
            border: 2px solid var(--color-purple);
        }

        .btn-secondary:hover {
            background: var(--color-purple);
            color: white;
        }

        @media (max-width: 768px) {
            .success-card {
                padding: var(--space-xl);
            }

            .success-title {
                font-size: var(--text-2xl);
            }

            .success-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="success-container">
        <div class="success-card">
            <div class="success-icon">
                <i data-lucide="check"></i>
            </div>

            <h1 class="success-title">Thank You for Your Donation!</h1>
            <p class="success-message">
                Your generous contribution will help us empower more students with thinking skills, self-awareness,
                and life direction through our programs.
            </p>

            <div class="reference-box" id="referenceBox" style="display: none;">
                <div class="reference-label">Transaction Reference</div>
                <div class="reference-code" id="referenceCode">-</div>
            </div>

            <div class="success-actions">
                <a href="index.html" class="btn btn-primary">
                    <i data-lucide="home"></i>
                    Return Home
                </a>
                <a href="index.html#impact" class="btn btn-secondary">
                    <i data-lucide="heart"></i>
                    See Our Impact
                </a>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        /**
         * Validate and sanitize URL reference parameter
         * Only allows alphanumeric characters, underscores, and hyphens
         * @param {string} ref - The reference string to validate
         * @returns {string|null} - Sanitized reference or null if invalid
         */
        function sanitizeReference(ref) {
            if (!ref || typeof ref !== 'string') return null;
            // Only allow alphanumeric, underscores, hyphens (typical Paystack reference format)
            const sanitized = ref.replace(/[^a-zA-Z0-9_-]/g, '');
            // Limit length and ensure it's not empty after sanitization
            if (sanitized.length === 0 || sanitized.length > 100) return null;
            return sanitized;
        }

        // Get reference from URL parameter with validation
        const urlParams = new URLSearchParams(window.location.search);
        const reference = sanitizeReference(urlParams.get('reference'));
        const trxref = sanitizeReference(urlParams.get('trxref'));

        const finalReference = reference || trxref;

        if (finalReference) {
            document.getElementById('referenceBox').style.display = 'block';
            // Using textContent is already safe, but we also validated the input
            document.getElementById('referenceCode').textContent = finalReference;
        }
    </script>
</body>

</html>
